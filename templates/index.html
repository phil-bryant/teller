<!DOCTYPE html>
<html>
<head>
    <title>Teller Integration</title>
    <script src="https://cdn.teller.io/connect/connect.js"></script>
</head>
<body>
    <button id="connect">Connect Bank Account</button>

    <script>
        const connectBtn = document.getElementById('connect');
        
        connectBtn.addEventListener('click', () => {
            // Disable hot reload temporarily
            if (window._websocket) {
                window._websocket.close();
            }

            TellerConnect.setup({
                applicationId: '{{ application_id }}',
                environment: 'development',
                onSuccess: async (enrollment) => {
                    const token = enrollment.accessToken;
                    await fetch('/api/store-token', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({token})
                    });
                    
                    const accounts = await fetch(`/api/accounts?access_token=${token}`);
                    console.log(await accounts.json());
                },
                onExit: () => {
                    console.log('User exited Teller Connect');
                    // Re-enable hot reload
                    location.reload();
                }
            }).open();
        });
    </script>
</body>
</html>
