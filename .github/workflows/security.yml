name: Security Scans

on:
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_high_critical:
        description: "Fail workflow on High/Critical findings"
        required: false
        default: false
        type: boolean

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select enforcement mode
        run: |
          FAIL_ON_HIGH="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ inputs.enforce_high_critical }}" == "true" ]]; then
            FAIL_ON_HIGH="true"
          fi
          echo "SECURITY_FAIL_ON_HIGH_CRITICAL=$FAIL_ON_HIGH" >> "$GITHUB_ENV"
          echo "RUN_TOKEN_CAPTURE_DAST=false" >> "$GITHUB_ENV"
          echo "RUN_DAST=true" >> "$GITHUB_ENV"
          echo "RUN_SAST=true" >> "$GITHUB_ENV"

      - name: Run security lane
        run: ./17_run_security_checks.sh

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: .security-reports/
