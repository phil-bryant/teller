name: security-nightly

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  nightly-security-deep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Create virtualenv
        run: ./02_create_venv.sh

      - name: Install project requirements
        run: ./03_load_requirements.sh

      - name: Dependency freshness gate
        run: |
          RUN_POSTGRES_FRESHNESS=false \
          RUN_TELLER_VERSION_FRESHNESS=true \
          DEPENDENCY_FAIL_ON_MAJOR=true \
          DEPENDENCY_FAIL_ON_DIRECT_OUTDATED=true \
          ./04_run_dependency_freshness_tests.sh

      - name: Fuzz lane
        run: |
          FUZZ_MAX_EXAMPLES=250 \
          FUZZ_TIMEOUT_SECONDS=900 \
          ./13_run_fuzz_tests.sh

      - name: Dynamic security smoke lane
        run: |
          mkdir -p ./ci-bin
          cat > ./ci-bin/1psa <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "-p" ]]; then
            printf '%s\n' "${TELLER_CLASSIFIER_WRITE_TOKEN:-ci-nightly-token}"
            exit 0
          fi
          exit 0
          EOF
          chmod +x ./ci-bin/1psa
          export PATH="${PWD}/ci-bin:${PATH}"
          RUN_SAST=false \
          RUN_DAST=true \
          RUN_SCHEMATHESIS=false \
          RUN_ZAP=false \
          DAST_CATEGORY_INTEGRITY_STRICT=false \
          TELLER_CLASSIFIER_WRITE_TOKEN=ci-nightly-token \
          ./22_run_dynamic_security_tests.sh

      - name: Script lane tests
        run: bats tests/sh/20_run_classification_api.bats tests/sh/22_run_dynamic_security_tests.bats
