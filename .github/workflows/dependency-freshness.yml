name: Dependency Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  dependency-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPORT_DIR: .security-reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Prepare Teller credentials (optional)
        env:
          TELLER_CERTIFICATE_PEM: ${{ secrets.TELLER_CERTIFICATE_PEM }}
          TELLER_PRIVATE_KEY_PEM: ${{ secrets.TELLER_PRIVATE_KEY_PEM }}
          TELLER_ACCESS_TOKEN: ${{ secrets.TELLER_ACCESS_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/teller"
          if [[ -n "${TELLER_CERTIFICATE_PEM}" && -n "${TELLER_PRIVATE_KEY_PEM}" ]]; then
            cert_path="$RUNNER_TEMP/teller/certificate.pem"
            key_path="$RUNNER_TEMP/teller/private_key.pem"
            printf '%s\n' "${TELLER_CERTIFICATE_PEM}" > "$cert_path"
            printf '%s\n' "${TELLER_PRIVATE_KEY_PEM}" > "$key_path"
            chmod 600 "$cert_path" "$key_path"
            echo "TELLER_CERT_PATH=$cert_path" >> "$GITHUB_ENV"
            echo "TELLER_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
          if [[ -n "${TELLER_ACCESS_TOKEN}" ]]; then
            echo "TELLER_ACCESS_TOKEN=$TELLER_ACCESS_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Dependency freshness report
        run: |
          mkdir -p "$REPORT_DIR"
          python scripts/check_dependency_freshness.py \
            --output-json "$REPORT_DIR/dependency-freshness.json" \
            --output-text "$REPORT_DIR/dependency-freshness.txt"
          cat "$REPORT_DIR/dependency-freshness.txt"

      - name: pip-audit report
        run: |
          set +e
          pip-audit --format json --output "$REPORT_DIR/pip-audit.json"
          status=$?
          set -e
          if [[ "$status" -gt 1 ]]; then
            echo "pip-audit execution failed"
            exit 1
          fi

      - name: Teller API drift canary
        run: |
          python scripts/check_teller_api_drift.py \
            --output-json "$REPORT_DIR/teller-api-drift.json" \
            --output-text "$REPORT_DIR/teller-api-drift.txt"
          cat "$REPORT_DIR/teller-api-drift.txt"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-freshness-reports
          path: |
            .security-reports/dependency-freshness.json
            .security-reports/dependency-freshness.txt
            .security-reports/pip-audit.json
            .security-reports/teller-api-drift.json
            .security-reports/teller-api-drift.txt
          if-no-files-found: error
