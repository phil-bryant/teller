name: security-pr

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pr-security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Create virtualenv
        run: ./02_create_venv.sh

      - name: Install project requirements
        run: ./03_load_requirements.sh

      - name: Static security gate (SAST + secret scanning)
        run: |
          RUN_SAST=true \
          RUN_DAST=false \
          RUN_SWIFT_SAST=false \
          SECURITY_FAIL_ON_HIGH_CRITICAL=true \
          ./22_run_dynamic_security_tests.sh

      - name: Targeted shell security tests
        run: bats tests/sh/20_run_classification_api.bats tests/sh/22_run_dynamic_security_tests.bats

      - name: Targeted API auth/validation tests
        run: PYTHONPATH=src ./teller-venv/bin/python -m unittest tests.py.test_teller_classification_api
