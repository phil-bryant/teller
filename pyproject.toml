[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teller"
version = "0.1.0"
authors = [
    { name = "phil-bryant", email = "phil-bryant@outlook.com" }
]
description = "Teller API Integration"
requires-python = ">=3.10"

[tool.setuptools]
packages = { find = { where = ["src"], include = ["teller", "teller.*"] } }

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "6.0"
cache_dir = "artifacts/cache/pytest"
# Hypothesis example DB: artifacts/cache/hypothesis (see tests/py/conftest.py and export_test_cache_env.sh)

[tool.ruff]
cache-dir = "artifacts/cache/ruff"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/teller"]
data_file = "artifacts/coverage/.coverage"

[tool.coverage.report]
show_missing = true
omit = ["tests/*", "deprecated/*"]
precision = 2

[tool.mutmut]
paths_to_mutate = ["src/teller/"]
only_mutate = [
  "src/teller/teller_db_profile.py",
  "src/teller/teller_db.py",
  "src/teller/teller_persist.py",
  "src/teller/teller_object.py",
  "src/teller/teller_mailcart_client.py",
  "src/teller/teller_base.py",
  "src/teller/teller_enums.py",
]
tests_dir = [
  "tests/py/test_teller_db_profile.py",
  "tests/py/properties/test_teller_persist_properties.py",
  "tests/py/properties/test_teller_db_profile_properties.py",
  "tests/py/test_teller_db.py",
  "tests/py/test_teller_persist.py",
  "tests/py/test_teller_object.py",
  "tests/py/test_teller_mailcart_client.py",
  "tests/py/test_teller_base.py",
  "tests/py/test_teller_enums.py",
]
