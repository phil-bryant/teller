[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teller"
version = "0.1.0"
authors = [
    { name = "Your Name" }
]
description = "Teller API Integration"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["teller"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mutmut]
paths_to_mutate = ["src/teller/"]
only_mutate = ["src/teller/teller_classification_api.py", "src/teller/teller_db_profile.py"]
tests_dir = [
  "tests/py/test_teller_classification_api.py",
  "tests/py/test_teller_db_profile.py",
  "tests/py/test_teller_properties.py",
]
pytest_add_cli_args = ["-p", "no:hypothesis"]
do_not_mutate = [
  "src/teller/teller_db.py",
  "src/teller/teller_persist.py",
  "src/teller/teller_mailcart_client.py",
]